<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Dómarar</title>
  <link
  rel="apple-touch-icon"
  sizes="180x180"
  href="/apple-touch-icon.png?v=1"
>
<link rel="stylesheet" href="css/style.css?v=23">
</head>
<body>

  <main class="app">

    <header class="topbar">
      <div class="brand">

        <div class="brand-logo">
    <img
        src="logos/domarar-logo.png"
        alt="Dómarar logo"
        width="52"
        height="52"
    >
</div>

        <div>
          <h1>DÓMARAR</h1>
          <p>Leikir og dómarar</p>
        </div>

      </div>

    </header>

    <section class="search-row">

      <label class="search-box">
        <span>⌕</span>

        <input
  id="search-input"
  type="search"
  placeholder="Leita að dómara, liði eða keppni..."
>
       <button
    id="search-clear"
    class="search-clear"
    type="button"
    aria-label="Hreinsa leit"
    hidden
>
    ×
</button> 
      </label>
     <div
    id="search-suggestions"
    class="search-suggestions"
    hidden
></div>
    </section>

  <div
    id="search-backdrop"
    class="search-backdrop"
    hidden
></div>  

<div
    id="gender-filters"
    class="gender-filters"
>
    <button
        class="gender-filter active"
        data-gender="all"
        type="button"
    >
        Allt
    </button>

    <button
        class="gender-filter"
        data-gender="Male"
        type="button"
    >
        Karlar
    </button>

    <button
        class="gender-filter"
        data-gender="Female"
        type="button"
    >
        Konur
    </button>
</div>
    <nav class="date-tabs">

      <button class="date-tab">
        <strong>Í dag</strong>
        <span>10. ágú</span>
      </button>

      <button class="date-tab">
        <strong>Á morgun</strong>
        <span>11. ágú</span>
      </button>

      <button class="date-tab today-tab active">
        <strong>Þri</strong>
        <span>12. ágú</span>
      </button>

      <button class="date-tab">
        <strong>Mið</strong>
        <span>13. ágú</span>
      </button>

      <button class="date-tab">
        <strong>Fim</strong>
        <span>14. ágú</span>
      </button>

    </nav>

   <section id="games-container">
    <p class="loading-message">
        Sæki leiki...
    </p>
</section>

  </main>

  <nav class="bottom-nav">

   <div class="bottom-message">
    <strong>Enginn dómari, enginn leikur.</strong>
         <span>Leikir og dómarar KSÍ</span>
</div>

  </nav>
<script src="js/app.js?v=36"></script>
<div class="match-report-overlay" id="match-report-overlay" hidden>

  <div class="match-report-modal">

    <button
      class="match-report-close"
      id="match-report-close"
      type="button"
      aria-label="Loka leikskýrslu"
    >
      ×
    </button>

    <div id="match-report-content"></div>

  </div>

</div>
</body>
</html>
