<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Dómarar</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header class="topbar">
      <div class="brand">

        <div class="brand-logo">
          D
        </div>

        <div>
          <h1>DÓMARAR</h1>
          <p>Leikir og dómarar</p>
        </div>

      </div>

      <button
        class="settings-button"
        aria-label="Stillingar"
      >
        ⚙
      </button>
    </header>

    <section class="search-row">

      <label class="search-box">
        <span>⌕</span>

        <input
          type="search"
          placeholder="Leita að dómara, liði eða keppni..."
        >
      </label>

      <button
        class="filter-button"
        aria-label="Síur"
      >
        ☷
      </button>

    </section>

    <nav class="date-tabs">

      <button class="date-tab active">
        <strong>Í dag</strong>
        <span>10. ágú</span>
      </button>

      <button class="date-tab">
        <strong>Á morgun</strong>
        <span>11. ágú</span>
      </button>

      <button class="date-tab">
        <strong>Þri</strong>
        <span>12. ágú</span>
      </button>

      <button class="date-tab">
        <strong>Mið</strong>
        <span>13. ágú</span>
      </button>

      <button class="date-tab">
        <strong>Fim</strong>
        <span>14. ágú</span>
      </button>

    </nav>

    <section>

      <h2 class="league-title">
        BESTA DEILD
      </h2>

      <article class="fixture-card">

        <div class="fixture-main">

          <div>
            <div class="fixture-time">
              19:15
            </div>

            <div class="fixture-venue">
              Víkingsvöllur<br>
              Reykjavík
            </div>
          </div>

          <div class="teams">

            <div>
              <div class="team-logo">
                V
              </div>

              <div class="team-name">
                Víkingur
              </div>
            </div>

            <div class="versus">
              VS
            </div>

            <div>
              <div class="team-logo">
                B
              </div>

              <div class="team-name">
                Breiðablik
              </div>
            </div>

          </div>

        </div>

        <div class="officials">

          <div class="official-row">
            <div class="official-role">
              Dómari
            </div>

            <div class="official-name">
              Einar Ingi Jónsson
            </div>
          </div>

          <div class="official-row">
            <div class="official-role">
              Aðstoðardómari 1
            </div>

            <div class="official-name">
              Birkir Sigurðarson
            </div>
          </div>

          <div class="official-row">
            <div class="official-role">
              Aðstoðardómari 2
            </div>

            <div class="official-name">
              Jónas Ingi Jónsson
            </div>
          </div>

          <div class="official-row">
            <div class="official-role">
              Fjórði dómari
            </div>

            <div class="official-name">
              Haukur Ingi Guðmundsson
            </div>
          </div>

        </div>

      </article>

    </section>

  </main>

  <nav class="bottom-nav">

    <button class="nav-item active">
      <span>▦</span>
      Í dag
    </button>

    <button class="nav-item">
      <span>▤</span>
      Leikir
    </button>

    <button class="nav-item">
      <span>⌕</span>
      Leita
    </button>

    <button class="nav-item">
      <span>☆</span>
      Fyrirlæti
    </button>

  </nav>

</body>
</html>
