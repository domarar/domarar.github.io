<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Dómarar</title>
  <link
  rel="apple-touch-icon"
  sizes="180x180"
  href="/apple-touch-icon.png?v=1"
>
<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>

  <main class="app">

    <header class="topbar">
      <div class="brand">

        <div class="brand-logo">
    <img
        src="logos/domarar-logo.png"
        alt="Dómarar logo"
        width="52"
        height="52"
    >
</div>

        <div>
          <h1>DÓMARAR</h1>
          <p>Leikir og dómarar</p>
        </div>

      </div>

      <button
        class="settings-button"
        aria-label="Stillingar"
      >
        ⚙
      </button>
    </header>

    <section class="search-row">

      <label class="search-box">
        <span>⌕</span>

        <input
  id="search-input"
  type="search"
  placeholder="Leita að dómara, liði eða keppni..."
>
      </label>

      <button
        class="filter-button"
        aria-label="Síur"
      >
        ☷
      </button>

    </section>

    <nav class="date-tabs">

      <button class="date-tab active">
        <strong>Í dag</strong>
        <span>10. ágú</span>
      </button>

      <button class="date-tab">
        <strong>Á morgun</strong>
        <span>11. ágú</span>
      </button>

      <button class="date-tab">
        <strong>Þri</strong>
        <span>12. ágú</span>
      </button>

      <button class="date-tab">
        <strong>Mið</strong>
        <span>13. ágú</span>
      </button>

      <button class="date-tab">
        <strong>Fim</strong>
        <span>14. ágú</span>
      </button>

    </nav>

   <section id="games-container">
    <p class="loading-message">
        Sæki leiki...
    </p>
</section>

  </main>

  <nav class="bottom-nav">

   <div class="bottom-message">
    <strong>Enginn dómari, enginn leikur.</strong>
    <span>DÓMARAR • Leikir og dómarar KSÍ</span>
</div>

  </nav>
<script src="js/app.js?v=18"></script>
</body>
</html>
